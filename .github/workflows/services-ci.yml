name: Services CI

on:
  push:
    paths:
      - "Services/**"
      - ".editorconfig"
      - ".gitignore"
      - ".github/CODEOWNERS"
      - "README.md"
      - "Docs/README.md"
      - "Scripts/README.md"
      - "SourceArt/README.md"
      - "Artifacts/README.md"
      - "Evidence/README.md"
      - "Contracts/OpenAPI/**"
      - "Contracts/Authentication/**"
      - "Contracts/Monitoring/**"
      - "Deploy/capacity/**"
      - "Deploy/linux/**"
      - "Deploy/postgres/**"
      - "Deploy/observability/**"
      - "Deploy/kubernetes/**"
      - "Deploy/Agones/**"
      - "Deploy/helm/**"
      - "Scripts/Test-ObservabilityContracts.ps1"
      - "Scripts/Test-MonitoringCapacityContracts.ps1"
      - "Scripts/Test-InvestigationHistoryContracts.ps1"
      - "Scripts/Test-SloReleaseGate.ps1"
      - "Scripts/Test-GovernanceContracts.ps1"
      - "Scripts/Test-ProjectStructureGovernance.ps1"
      - "Scripts/Test-ReleaseGovernance.ps1"
      - "Scripts/lib/**"
      - "Docs/RUNBOOKS/SLO_MULTI_CLUSTER_GOVERNANCE.md"
      - "Scripts/Load/**"
      - "Scripts/Linux/test-postgres-least-privilege.sh"
      - "Scripts/Linux/**"
      - ".github/workflows/services-ci.yml"
  pull_request:
    paths:
      - "Services/**"
      - ".editorconfig"
      - ".gitignore"
      - ".github/CODEOWNERS"
      - "README.md"
      - "Docs/README.md"
      - "Scripts/README.md"
      - "SourceArt/README.md"
      - "Artifacts/README.md"
      - "Evidence/README.md"
      - "Contracts/OpenAPI/**"
      - "Contracts/Authentication/**"
      - "Contracts/Monitoring/**"
      - "Deploy/capacity/**"
      - "Deploy/linux/**"
      - "Deploy/postgres/**"
      - "Deploy/observability/**"
      - "Deploy/kubernetes/**"
      - "Deploy/Agones/**"
      - "Deploy/helm/**"
      - "Scripts/Test-ObservabilityContracts.ps1"
      - "Scripts/Test-MonitoringCapacityContracts.ps1"
      - "Scripts/Test-InvestigationHistoryContracts.ps1"
      - "Scripts/Test-SloReleaseGate.ps1"
      - "Scripts/Test-GovernanceContracts.ps1"
      - "Scripts/Test-ProjectStructureGovernance.ps1"
      - "Scripts/Test-ReleaseGovernance.ps1"
      - "Scripts/lib/**"
      - "Docs/RUNBOOKS/SLO_MULTI_CLUSTER_GOVERNANCE.md"
      - "Scripts/Load/**"
      - "Scripts/Linux/test-postgres-least-privilege.sh"
      - "Scripts/Linux/**"
      - ".github/workflows/services-ci.yml"

permissions:
  contents: read

jobs:
  angular-admin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Services/GuiyangMahjong.Admin/ClientApp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: Services/GuiyangMahjong.Admin/ClientApp/package-lock.json
      - name: Install locked Angular dependencies
        run: npm ci
      - name: TypeScript and security lint
        run: npm run lint
      - name: Angular unit tests
        run: npm run test -- --watch=false
      - name: Angular production build
        run: npm run build
      - name: Dependency vulnerability gate
        run: npm audit --audit-level=high

  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: guiyang_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d guiyang_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: Services
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore GuiyangMahjong.Services.slnx
      - name: Project structure governance gate
        working-directory: .
        shell: pwsh
        run: ./Scripts/Test-ProjectStructureGovernance.ps1
      - name: Build
        run: dotnet build GuiyangMahjong.Services.slnx --configuration Release --no-restore
      - name: Unit and contract tests
        run: >-
          dotnet test GuiyangMahjong.Services.slnx
          --configuration Release
          --no-build
          --filter "Category!=ExternalPersistence"
          --logger "trx;LogFileName=services.trx"
      - name: Observability contract gate
        working-directory: .
        shell: pwsh
        run: ./Scripts/Test-ObservabilityContracts.ps1 -SkipDockerValidation
      - name: Pagination, SSE, and capacity contract gate
        working-directory: .
        shell: pwsh
        run: ./Scripts/Test-MonitoringCapacityContracts.ps1
      - name: Persistent history and investigation closure contract gate
        working-directory: .
        shell: pwsh
        run: ./Scripts/Test-InvestigationHistoryContracts.ps1
      - name: Multi-cluster SLO and governance contract gate
        working-directory: .
        shell: pwsh
        run: ./Scripts/Test-GovernanceContracts.ps1
      - name: Configuration, canary, and version governance gate
        working-directory: .
        shell: pwsh
        run: ./Scripts/Test-ReleaseGovernance.ps1
      - name: Auth and Lobby external persistence tests
        run: |
          dotnet test GuiyangMahjong.Auth.Tests/GuiyangMahjong.Auth.Tests.csproj --configuration Release --no-build --filter "Category=ExternalPersistence" --logger "trx;LogFileName=auth-external-persistence.trx"
          dotnet test GuiyangMahjong.Lobby.Tests/GuiyangMahjong.Lobby.Tests.csproj --configuration Release --no-build --filter "Category=ExternalPersistence" --logger "trx;LogFileName=lobby-external-persistence.trx"
          dotnet test Apps/GuiyangMahjong.Configuration.Tests/GuiyangMahjong.Configuration.Tests.csproj --configuration Release --no-build --filter "Category=ExternalPersistence" --logger "trx;LogFileName=configuration-external-persistence.trx"
        env:
          AUTH_TEST_POSTGRES: Host=127.0.0.1;Port=5432;Database=guiyang_ci;Username=postgres;Password=postgres
          LOBBY_TEST_POSTGRES: Host=127.0.0.1;Port=5432;Database=guiyang_ci;Username=postgres;Password=postgres
          LOBBY_TEST_REDIS: 127.0.0.1:6379,abortConnect=false
          CONFIGURATION_TEST_POSTGRES: Host=127.0.0.1;Port=5432;Database=guiyang_ci;Username=postgres;Password=postgres
      - name: PostgreSQL least-privilege enforcement
        working-directory: .
        shell: bash
        run: bash ./Scripts/Linux/test-postgres-least-privilege.sh
        env:
          LEAST_PRIVILEGE_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/guiyang_ci
          PGHOST: 127.0.0.1
          PGPORT: "5432"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: services-test-results
          path: "Services/**/TestResults/*.trx"
          if-no-files-found: error

  docker-build-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: auth
            dockerfile: Services/GuiyangMahjong.Auth/Dockerfile
            target: ""
          - name: lobby
            dockerfile: Services/GuiyangMahjong.Lobby/Dockerfile
            target: ""
          - name: player-data
            dockerfile: Services/GuiyangMahjong.PlayerData/Dockerfile
            target: ""
          - name: admin
            dockerfile: Services/GuiyangMahjong.Admin/Dockerfile
            target: ""
          - name: configuration
            dockerfile: Services/Apps/GuiyangMahjong.Configuration/Dockerfile
            target: ""
          - name: edge-gateway
            dockerfile: Services/Apps/GuiyangMahjong.EdgeGateway/Dockerfile
            target: ""
          - name: game-data
            dockerfile: Services/Apps/GuiyangMahjong.GameData/Dockerfile
            target: ""
          - name: workers
            dockerfile: Services/Apps/GuiyangMahjong.Workers/Dockerfile
            target: ""
          # Services CI 没有 UE LinuxServer 制品，只验证 Allocator 编译阶段。
          # 最终 game-node 由携带真实 Artifacts/LinuxServer 的发布链构建。
          - name: allocator-build
            dockerfile: Services/GuiyangMahjong.Allocator/Dockerfile
            target: build
    steps:
      - uses: actions/checkout@v4
      - name: Build ${{ matrix.name }} image
        shell: bash
        env:
          DOCKER_BUILDKIT: "1"
          MATRIX_DOCKERFILE: ${{ matrix.dockerfile }}
          MATRIX_NAME: ${{ matrix.name }}
          MATRIX_TARGET: ${{ matrix.target }}
        run: |
          arguments=(
            --file "${MATRIX_DOCKERFILE}"
            --tag "local/guiyang-mahjong-${MATRIX_NAME}:ci"
          )
          if [[ -n "${MATRIX_TARGET}" ]]; then
            arguments+=(--target "${MATRIX_TARGET}")
          fi
          docker build "${arguments[@]}" .
      - name: Generate image SBOM
        uses: anchore/sbom-action@v0
        with:
          image: local/guiyang-mahjong-${{ matrix.name }}:ci
          artifact-name: sbom-${{ matrix.name }}.spdx.json
          output-file: sbom-${{ matrix.name }}.spdx.json
      - name: Scan image vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: local/guiyang-mahjong-${{ matrix.name }}:ci
          format: sarif
          output: trivy-${{ matrix.name }}.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"

  linux-deployment-files:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.18.4
      - name: Validate Linux deployment files
        run: |
          bash -n Deploy/linux/deploy.sh
          bash -n Scripts/Linux/test-services.sh
          bash -n Scripts/Linux/smoke-deployment.sh
          bash -n Scripts/Linux/diagnose-network.sh
          bash -n Scripts/Linux/test-deployment-rollback.sh
          bash -n Scripts/Linux/test-postgres-least-privilege.sh
          docker compose --env-file Deploy/linux/.env.example -f Deploy/linux/compose.yaml config --quiet
          helm lint Deploy/helm/guiyang-mahjong
          helm template mahjong Deploy/helm/guiyang-mahjong > /tmp/mahjong-rendered.yaml
          GRAFANA_ADMIN_PASSWORD=ci-observability-password-00000001 LOKI_QUERY_TOKEN=ci-loki-query-token-00000000000001 docker compose -f Deploy/observability/compose.yaml config --quiet
