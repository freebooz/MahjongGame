# 本地单节点 JetStream 配置。账号密码由 Compose 环境变量注入，文件中不得保存真实凭据。
server_name: mahjong-nats-local
port: 4222
http: 8222

jetstream {
  store_dir: "/data/jetstream"
  max_memory_store: 256MB
  max_file_store: 10GB
}

# 本地环境由同一个 Worker 身份负责创建 Stream、发布与消费；生产环境必须拆分管理、发布和消费权限。
authorization {
  users: [
    {
      user: $NATS_USERNAME
      password: $NATS_PASSWORD
      permissions: {
        publish: [">"]
        subscribe: [">"]
      }
    }
  ]
}

