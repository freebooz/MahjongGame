# 三节点生产模板。用户名和密码由 Kubernetes Secret 注入；证书终止可由服务网格或后续 NATS TLS 配置覆盖。
server_name: $NATS_SERVER_NAME
port: 4222
http: 8222

jetstream {
  domain: MAHJONG
  store_dir: "/data/jetstream"
  max_memory_store: 1GB
  max_file_store: 100GB
}

cluster {
  name: mahjong-nats
  port: 6222
  routes: [
    nats://mahjong-nats-0.mahjong-nats-headless.guiyang-mahjong.svc:6222,
    nats://mahjong-nats-1.mahjong-nats-headless.guiyang-mahjong.svc:6222,
    nats://mahjong-nats-2.mahjong-nats-headless.guiyang-mahjong.svc:6222
  ]
}

# Worker 只能访问首批 Subject、JetStream 管理请求和自身回复 Inbox，不拥有任意业务 Subject 权限。
authorization {
  users: [{
    user: $NATS_USERNAME
    password: $NATS_PASSWORD
    permissions: {
      publish: [
        "identity.session.*.v1", "room.*.v1", "allocation.requested.v1",
        "gameserver.*.v1", "player.*.v1", "match.*.v1",
        "settlement.committed.v1", "platform.failed.v1",
        "$JS.API.>", "$JS.ACK.>"
      ]
      subscribe: ["_INBOX.>"]
    }
  }]
}

