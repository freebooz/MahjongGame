name: guiyang-mahjong

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mahjong
      POSTGRES_USER: mahjong
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mahjong -d mahjong"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    cpus: ${POSTGRES_CPUS:-2.0}
    mem_limit: ${POSTGRES_MEMORY:-2g}
    pids_limit: 256
    security_opt: ["no-new-privileges:true"]
    logging: &logging
      driver: json-file
      options: {max-size: "20m", max-file: "5"}

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    cpus: ${REDIS_CPUS:-1.0}
    mem_limit: ${REDIS_MEMORY:-1g}
    pids_limit: 256
    security_opt: ["no-new-privileges:true"]
    logging: *logging

  auth:
    image: ${IMAGE_REGISTRY:-local}/guiyang-mahjong-auth:${MAHJONG_VERSION:-dev}
    build:
      context: ../..
      dockerfile: Services/GuiyangMahjong.Auth/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Auth__PersistenceMode: Postgres
      Auth__PostgresConnectionString: Host=postgres;Port=5432;Database=mahjong;Username=mahjong;Password=${POSTGRES_PASSWORD}
      Auth__TokenSigningKey: ${PLAYER_TOKEN_SIGNING_KEY:?PLAYER_TOKEN_SIGNING_KEY is required}
      Auth__GuestIdentityPepper: ${GUEST_IDENTITY_PEPPER:?GUEST_IDENTITY_PEPPER is required}
      Auth__MonitoringReadOnlyToken: ${MONITORING_READ_ONLY_TOKEN:?MONITORING_READ_ONLY_TOKEN is required}
      Auth__ManagementCommandToken: ${AUTH_MANAGEMENT_COMMAND_TOKEN:?AUTH_MANAGEMENT_COMMAND_TOKEN is required}
    depends_on:
      postgres: {condition: service_healthy}
    ports: ["${AUTH_PORT:-18082}:8080"]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8080/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    cpus: ${AUTH_CPUS:-1.0}
    mem_limit: ${AUTH_MEMORY:-512m}
    pids_limit: 256
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
    security_opt: ["no-new-privileges:true"]
    logging: *logging

  game-node:
    image: ${IMAGE_REGISTRY:-local}/guiyang-mahjong-game-node:${MAHJONG_VERSION:-dev}
    build:
      context: ../..
      dockerfile: Services/GuiyangMahjong.Allocator/Dockerfile
    environment:
      ASPNETCORE_URLS: http://0.0.0.0:${ALLOCATOR_PORT:-18081}
      ASPNETCORE_ENVIRONMENT: Production
      Allocator__PortStart: ${GAME_PORT_START:-19000}
      Allocator__PortEnd: ${GAME_PORT_END:-19099}
      Allocator__AdvertisedIp: ${ADVERTISED_IP:?ADVERTISED_IP is required}
      Allocator__GameServerExecutablePath: /opt/guiyang-mahjong/server/GuiyangMahjongServer
      Allocator__GameServerWorkingDirectory: /opt/guiyang-mahjong/server
      Allocator__GameServerPrefixArguments__0: ${GAME_SERVER_MAP:?GAME_SERVER_MAP is required}
      Allocator__MatchResultOutboxDirectory: /var/lib/guiyang-mahjong/outbox
      Allocator__StateFilePath: /var/lib/guiyang-mahjong/state/instances.json
      # UE uses a dynamic UDP port range. Host networking avoids the Docker
      # bridge/NAT return-path loss seen when a Windows client connects to a
      # WSL mirrored-network address on the same machine.
      Allocator__LobbyInternalUrl: http://127.0.0.1:${LOBBY_PORT:-18080}
      Allocator__ServiceToken: ${ALLOCATOR_SERVICE_TOKEN:?ALLOCATOR_SERVICE_TOKEN is required}
      Allocator__MonitoringReadOnlyToken: ${MONITORING_READ_ONLY_TOKEN:?MONITORING_READ_ONLY_TOKEN is required}
      Allocator__ManagementCommandToken: ${ALLOCATOR_MANAGEMENT_COMMAND_TOKEN:?ALLOCATOR_MANAGEMENT_COMMAND_TOKEN is required}
      Allocator__LobbyCallbackToken: ${LOBBY_INTERNAL_TOKEN:?LOBBY_INTERNAL_TOKEN is required}
      Allocator__JoinTicketSigningKey: ${JOIN_TICKET_SIGNING_KEY:?JOIN_TICKET_SIGNING_KEY is required}
    volumes:
      - ${MAHJONG_DATA_ROOT:-/var/lib/guiyang-mahjong}/allocator:/var/lib/guiyang-mahjong
    network_mode: host
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error http://127.0.0.1:${ALLOCATOR_PORT:-18081}/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    cpus: ${GAME_NODE_CPUS:-8.0}
    mem_limit: ${GAME_NODE_MEMORY:-16g}
    pids_limit: 2048
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
      - /opt/guiyang-mahjong/server/GuiyangMahjong/Saved:rw,noexec,nosuid,nodev,size=256m,mode=1777
      - /opt/guiyang-mahjong/server/Engine/Saved:rw,noexec,nosuid,nodev,size=64m,mode=1777
      - /home/app/.config:rw,noexec,nosuid,nodev,size=16m,mode=1777
    security_opt: ["no-new-privileges:true"]
    logging: *logging

  lobby:
    image: ${IMAGE_REGISTRY:-local}/guiyang-mahjong-lobby:${MAHJONG_VERSION:-dev}
    build:
      context: ../..
      dockerfile: Services/GuiyangMahjong.Lobby/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Lobby__Persistence__Mode: RedisPostgres
      Lobby__Persistence__RedisConnectionString: redis:6379,abortConnect=false
      Lobby__Persistence__PostgresConnectionString: Host=postgres;Port=5432;Database=mahjong;Username=mahjong;Password=${POSTGRES_PASSWORD}
      Lobby__TokenSigningKey: ${PLAYER_TOKEN_SIGNING_KEY:?PLAYER_TOKEN_SIGNING_KEY is required}
      Lobby__JoinTicketSigningKey: ${JOIN_TICKET_SIGNING_KEY:?JOIN_TICKET_SIGNING_KEY is required}
      Lobby__InternalServiceToken: ${LOBBY_INTERNAL_TOKEN:?LOBBY_INTERNAL_TOKEN is required}
      Lobby__MonitoringReadOnlyToken: ${MONITORING_READ_ONLY_TOKEN:?MONITORING_READ_ONLY_TOKEN is required}
      Lobby__ManagementCommandToken: ${LOBBY_MANAGEMENT_COMMAND_TOKEN:?LOBBY_MANAGEMENT_COMMAND_TOKEN is required}
      Lobby__AccessRevocationTtlMinutes: ${LOBBY_ACCESS_REVOCATION_TTL_MINUTES:-120}
      Lobby__Allocator__Enabled: "true"
      Lobby__Allocator__BaseUrl: http://host.docker.internal:${ALLOCATOR_PORT:-18081}
      Lobby__Allocator__ServiceToken: ${ALLOCATOR_SERVICE_TOKEN:?ALLOCATOR_SERVICE_TOKEN is required}
      Lobby__Allocator__GameServerBuildVersion: ${MAHJONG_VERSION:-dev}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports: ["${LOBBY_PORT:-18080}:8080"]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8080/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    cpus: ${LOBBY_CPUS:-2.0}
    mem_limit: ${LOBBY_MEMORY:-1g}
    pids_limit: 512
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
    security_opt: ["no-new-privileges:true"]
    logging: *logging

  player-data:
    image: ${IMAGE_REGISTRY:-local}/guiyang-mahjong-player-data:${MAHJONG_VERSION:-dev}
    build:
      context: ../..
      dockerfile: Services/GuiyangMahjong.PlayerData/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      PlayerData__PersistenceMode: Postgres
      PlayerData__PostgresConnectionString: Host=postgres;Port=5432;Database=mahjong;Username=mahjong;Password=${POSTGRES_PASSWORD}
      PlayerData__SourceIngestionToken: ${PLAYER_DATA_SOURCE_INGESTION_TOKEN:?PLAYER_DATA_SOURCE_INGESTION_TOKEN is required}
      PlayerData__AdminCommandToken: ${PLAYER_DATA_ADMIN_COMMAND_TOKEN:?PLAYER_DATA_ADMIN_COMMAND_TOKEN is required}
      PlayerData__ChatGatewayToken: ${PLAYER_DATA_CHAT_GATEWAY_TOKEN:?PLAYER_DATA_CHAT_GATEWAY_TOKEN is required}
      PlayerData__MonitoringToken: ${PLAYER_DATA_MONITORING_TOKEN:?PLAYER_DATA_MONITORING_TOKEN is required}
      PlayerData__AuthBaseUrl: http://auth:8080
      PlayerData__AuthMonitoringToken: ${MONITORING_READ_ONLY_TOKEN:?MONITORING_READ_ONLY_TOKEN is required}
      PlayerData__AdminProjectionBaseUrl: http://admin:8080
      PlayerData__AdminEvidenceIngestionToken: ${ADMIN_EVIDENCE_INGESTION_TOKEN:?ADMIN_EVIDENCE_INGESTION_TOKEN is required}
      PlayerData__ProjectionEnabled: "true"
      PlayerData__ProjectionPollMilliseconds: ${PLAYER_DATA_PROJECTION_POLL_MS:-1000}
      PlayerData__ProjectionMaxAttempts: ${PLAYER_DATA_PROJECTION_MAX_ATTEMPTS:-10}
    depends_on:
      postgres: {condition: service_healthy}
      auth: {condition: service_healthy}
    ports: ["${PLAYER_DATA_PORT:-18084}:8080"]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8080/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    cpus: ${PLAYER_DATA_CPUS:-1.0}
    mem_limit: ${PLAYER_DATA_MEMORY:-512m}
    pids_limit: 256
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
    security_opt: ["no-new-privileges:true"]
    logging: *logging

  admin:
    image: ${IMAGE_REGISTRY:-local}/guiyang-mahjong-admin:${MAHJONG_VERSION:-dev}
    build:
      context: ../..
      dockerfile: Services/GuiyangMahjong.Admin/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Admin__ReadOnlyAccessToken: ${ADMIN_READ_ONLY_TOKEN:?ADMIN_READ_ONLY_TOKEN is required}
      Admin__EvidenceIngestionToken: ${ADMIN_EVIDENCE_INGESTION_TOKEN:?ADMIN_EVIDENCE_INGESTION_TOKEN is required}
      Admin__EnterpriseIdentity__Enabled: ${ADMIN_ENTERPRISE_IDENTITY_ENABLED:-false}
      Admin__EnterpriseIdentity__Authority: ${ADMIN_OIDC_AUTHORITY:-}
      Admin__EnterpriseIdentity__Audience: ${ADMIN_OIDC_AUDIENCE:-}
      Admin__EnterpriseIdentity__RequireHttpsMetadata: "true"
      Admin__EnterpriseIdentity__RequireMfa: "true"
      Admin__AuditArchive__Enabled: ${ADMIN_AUDIT_ARCHIVE_ENABLED:-false}
      Admin__AuditArchive__AppendUrl: ${ADMIN_AUDIT_ARCHIVE_APPEND_URL:-}
      Admin__AuditArchive__AppendToken: ${ADMIN_AUDIT_ARCHIVE_APPEND_TOKEN:-}
      Admin__AuditArchive__PollIntervalMilliseconds: ${ADMIN_AUDIT_ARCHIVE_POLL_MS:-1000}
      Admin__AuditArchive__MaxAttempts: ${ADMIN_AUDIT_ARCHIVE_MAX_ATTEMPTS:-20}
      Admin__Management__Enabled: ${ADMIN_MANAGEMENT_ENABLED:-false}
      Admin__Management__ExecutionEnabled: ${ADMIN_COMMAND_EXECUTION_ENABLED:-false}
      Admin__Management__PollIntervalMilliseconds: ${ADMIN_COMMAND_POLL_INTERVAL_MS:-1000}
      Admin__Management__LeaseSeconds: ${ADMIN_COMMAND_LEASE_SECONDS:-30}
      Admin__Management__MaxAttempts: ${ADMIN_COMMAND_MAX_ATTEMPTS:-5}
      Admin__Management__RetryBaseSeconds: ${ADMIN_COMMAND_RETRY_BASE_SECONDS:-5}
      Admin__Management__AuthCommandToken: ${AUTH_MANAGEMENT_COMMAND_TOKEN:?AUTH_MANAGEMENT_COMMAND_TOKEN is required}
      Admin__Management__LobbyCommandToken: ${LOBBY_MANAGEMENT_COMMAND_TOKEN:?LOBBY_MANAGEMENT_COMMAND_TOKEN is required}
      Admin__Management__CommandTimeoutSeconds: ${ADMIN_COMMAND_TIMEOUT_SECONDS:-5}
      Admin__Management__TemporaryFreezeHours: ${ADMIN_TEMPORARY_FREEZE_HOURS:-24}
      Admin__Management__MuteHours: ${ADMIN_MUTE_HOURS:-24}
      Admin__Management__RiskLabelTtlDays: ${ADMIN_RISK_LABEL_TTL_DAYS:-30}
      Admin__Management__PersistenceMode: Postgres
      Admin__Management__PostgresConnectionString: Host=postgres;Port=5432;Database=mahjong;Username=mahjong;Password=${POSTGRES_PASSWORD}
      Admin__Wallet__Enabled: "true"
      Admin__Wallet__BaseUrl: http://player-data:8080
      Admin__Wallet__CommandToken: ${PLAYER_DATA_ADMIN_COMMAND_TOKEN:?PLAYER_DATA_ADMIN_COMMAND_TOKEN is required}
      Admin__Wallet__TimeoutSeconds: ${ADMIN_WALLET_TIMEOUT_SECONDS:-5}
      Admin__Principals__0__OperatorId: ${ADMIN_ROOM_OPERATOR_ID:-room-operator}
      Admin__Principals__0__AccessToken: ${ADMIN_ROOM_OPERATOR_TOKEN:?ADMIN_ROOM_OPERATOR_TOKEN is required}
      Admin__Principals__0__Roles__0: room.viewer
      Admin__Principals__0__Roles__1: player.viewer
      Admin__Principals__0__Roles__2: room.operator
      Admin__Principals__1__OperatorId: ${ADMIN_ROOM_APPROVER_ID:-room-approver}
      Admin__Principals__1__AccessToken: ${ADMIN_ROOM_APPROVER_TOKEN:?ADMIN_ROOM_APPROVER_TOKEN is required}
      Admin__Principals__1__Roles__0: room.viewer
      Admin__Principals__1__Roles__1: room.approver
      Admin__Principals__1__Roles__2: audit.viewer
      Admin__Principals__2__OperatorId: ${ADMIN_PLAYER_OPERATOR_ID:-player-operator}
      Admin__Principals__2__AccessToken: ${ADMIN_PLAYER_OPERATOR_TOKEN:?ADMIN_PLAYER_OPERATOR_TOKEN is required}
      Admin__Principals__2__Roles__0: player.viewer
      Admin__Principals__2__Roles__1: player.operator
      Admin__Principals__3__OperatorId: ${ADMIN_PLAYER_APPROVER_ID:-player-approver}
      Admin__Principals__3__AccessToken: ${ADMIN_PLAYER_APPROVER_TOKEN:?ADMIN_PLAYER_APPROVER_TOKEN is required}
      Admin__Principals__3__Roles__0: player.viewer
      Admin__Principals__3__Roles__1: player.approver
      Admin__Principals__3__Roles__2: audit.viewer
      Admin__Principals__4__OperatorId: ${ADMIN_INFRASTRUCTURE_OPERATOR_ID:-infrastructure-operator}
      Admin__Principals__4__AccessToken: ${ADMIN_INFRASTRUCTURE_OPERATOR_TOKEN:?ADMIN_INFRASTRUCTURE_OPERATOR_TOKEN is required}
      Admin__Principals__4__Roles__0: room.viewer
      Admin__Principals__4__Roles__1: infrastructure.operator
      Admin__Principals__5__OperatorId: ${ADMIN_SANCTION_OPERATOR_ID:-sanction-operator}
      Admin__Principals__5__AccessToken: ${ADMIN_SANCTION_OPERATOR_TOKEN:?ADMIN_SANCTION_OPERATOR_TOKEN is required}
      Admin__Principals__5__Roles__0: player.viewer
      Admin__Principals__5__Roles__1: sanction.operator
      Admin__Principals__6__OperatorId: ${ADMIN_RISK_ANALYST_ID:-risk-analyst}
      Admin__Principals__6__AccessToken: ${ADMIN_RISK_ANALYST_TOKEN:?ADMIN_RISK_ANALYST_TOKEN is required}
      Admin__Principals__6__Roles__0: player.viewer
      Admin__Principals__6__Roles__1: risk.analyst
      Admin__Principals__7__OperatorId: ${ADMIN_SUPPORT_OPERATOR_ID:-support-operator}
      Admin__Principals__7__AccessToken: ${ADMIN_SUPPORT_OPERATOR_TOKEN:?ADMIN_SUPPORT_OPERATOR_TOKEN is required}
      Admin__Principals__7__Roles__0: player.viewer
      Admin__Principals__7__Roles__1: support.operator
      Admin__Principals__8__OperatorId: ${ADMIN_COMPENSATION_OPERATOR_ID:-compensation-operator}
      Admin__Principals__8__AccessToken: ${ADMIN_COMPENSATION_OPERATOR_TOKEN:?ADMIN_COMPENSATION_OPERATOR_TOKEN is required}
      Admin__Principals__8__Roles__0: room.viewer
      Admin__Principals__8__Roles__1: compensation.operator
      Admin__Principals__9__OperatorId: ${ADMIN_CHAT_COMPLIANCE_ID:-chat-compliance}
      Admin__Principals__9__AccessToken: ${ADMIN_CHAT_COMPLIANCE_TOKEN:?ADMIN_CHAT_COMPLIANCE_TOKEN is required}
      Admin__Principals__9__Roles__0: player.viewer
      Admin__Principals__9__Roles__1: chat.compliance
      Admin__Auth__Enabled: "true"
      Admin__Auth__BaseUrl: http://auth:8080
      Admin__Auth__MonitoringToken: ${MONITORING_READ_ONLY_TOKEN:?MONITORING_READ_ONLY_TOKEN is required}
      Admin__Lobby__Enabled: "true"
      Admin__Lobby__BaseUrl: http://lobby:8080
      Admin__Lobby__MonitoringToken: ${MONITORING_READ_ONLY_TOKEN:?MONITORING_READ_ONLY_TOKEN is required}
      Admin__Allocators__0__Enabled: "true"
      Admin__Allocators__0__ClusterId: ${MAHJONG_CLUSTER_ID:-local-linux}
      Admin__Allocators__0__NodeId: ${MAHJONG_NODE_ID:-game-node}
      Admin__Allocators__0__BaseUrl: http://host.docker.internal:${ALLOCATOR_PORT:-18081}
      Admin__Allocators__0__MonitoringToken: ${MONITORING_READ_ONLY_TOKEN:?MONITORING_READ_ONLY_TOKEN is required}
      Admin__Allocators__0__ManagementCommandToken: ${ALLOCATOR_MANAGEMENT_COMMAND_TOKEN:?ALLOCATOR_MANAGEMENT_COMMAND_TOKEN is required}
    depends_on:
      auth: {condition: service_healthy}
      lobby: {condition: service_healthy}
      game-node: {condition: service_healthy}
      player-data: {condition: service_healthy}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports: ["${ADMIN_PORT:-18083}:8080"]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8080/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    cpus: ${ADMIN_CPUS:-1.0}
    mem_limit: ${ADMIN_MEMORY:-512m}
    pids_limit: 256
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
    security_opt: ["no-new-privileges:true"]
    logging: *logging

volumes:
  postgres-data:
  redis-data:
