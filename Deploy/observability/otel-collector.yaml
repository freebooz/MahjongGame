extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128
  attributes/sensitive:
    actions:
      # 第二道防线：即使生产者遗漏脱敏，也不向后端传播常见凭据和正文属性。
      - {key: password, action: delete}
      - {key: token, action: delete}
      - {key: authorization, action: delete}
      - {key: cookie, action: delete}
      - {key: secret, action: delete}
      - {key: connection_string, action: delete}
      - {key: signing_key, action: delete}
      - {key: card_number, action: delete}
      - {key: cvv, action: delete}
      - {key: chat_content, action: delete}
      - {key: message_content, action: delete}
      - {key: raw_ip, action: delete}
      - {key: ip_address, action: delete}
  transform/redaction:
    error_mode: ignore
    log_statements:
      - context: log
        statements:
          - replace_pattern(log.body, "(?i)Bearer\\s+[A-Za-z0-9._~+/=-]+", "Bearer ***")
          - replace_pattern(log.body, "\\b(?:\\d[ -]*?){13,19}\\b", "***")
  batch:
    send_batch_size: 1024
    timeout: 2s

exporters:
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  prometheus:
    endpoint: 0.0.0.0:9464
    enable_open_metrics: true

service:
  extensions: [health_check]
  telemetry:
    logs:
      level: info
  pipelines:
    logs:
      receivers: [otlp]
      processors: [memory_limiter, attributes/sensitive, transform/redaction, batch]
      exporters: [otlphttp/loki]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes/sensitive, batch]
      exporters: [otlp/tempo]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, attributes/sensitive, batch]
      exporters: [prometheus]
