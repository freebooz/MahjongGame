global:
  scrape_interval: 5s
  evaluation_interval: 5s
  external_labels:
    environment: local

rule_files:
  - /etc/prometheus/rules/*.yaml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
  - job_name: otel-collector
    static_configs:
      - targets: [otel-collector:9464]
# Prometheus 抓取配置：采集各服务、Dedicated Server 和可观测性组件的指标。
# 抓取目标使用内部网络与最小只读认证；高基数标签禁止包含玩家、房间密码或 TraceId 全量值。
# 新增服务需同时提供健康指标、SLO 规则和告警负责人，抓取失败不得被静默忽略。
