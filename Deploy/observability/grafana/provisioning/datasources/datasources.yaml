apiVersion: 1

datasources:
  - name: Prometheus
    uid: mahjong-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: mahjong-tempo
  - name: Loki
    uid: mahjong-loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      derivedFields:
        - name: TraceId
          matcherRegex: '"TraceId":"([^"]+)"'
          datasourceUid: mahjong-tempo
          url: '$${__value.raw}'
  - name: Tempo
    uid: mahjong-tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
    jsonData:
      tracesToLogsV2:
        datasourceUid: mahjong-loki
        spanStartTimeShift: -5m
        spanEndTimeShift: 5m
        filterByTraceID: true
        filterBySpanID: false
      serviceMap:
        datasourceUid: mahjong-prometheus
# Grafana 数据源自动配置：连接 Prometheus、Loki 和 Tempo，并建立指标、日志、追踪关联。
# 数据源仅使用集群内部只读地址；生产凭据从环境/Secret 注入，不得写入本文件。
# UID 被仪表盘稳定引用，修改前需同步全部 dashboard 并验证跨信号跳转。
