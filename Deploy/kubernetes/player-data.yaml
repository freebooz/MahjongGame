apiVersion: apps/v1
kind: Deployment
metadata:
  name: mahjong-player-data
  namespace: guiyang-mahjong
spec:
  replicas: 2
  selector: {matchLabels: {app: mahjong-player-data}}
  template:
    metadata: {labels: {app: mahjong-player-data}}
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: player-data
          image: ghcr.io/freebooz/guiyang-mahjong-player-data:REPLACE_WITH_GIT_SHA
          ports: [{name: http, containerPort: 8080}]
          envFrom:
            - configMapRef: {name: mahjong-services}
            - secretRef: {name: mahjong-secrets}
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 15
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: mahjong-player-data
  namespace: guiyang-mahjong
spec:
  selector: {app: mahjong-player-data}
  ports: [{name: http, port: 8080, targetPort: http}]
