apiVersion: apps/v1
kind: Deployment
metadata:
  name: mahjong-player-data
  namespace: guiyang-mahjong
spec:
  replicas: 2
  selector: {matchLabels: {app: mahjong-player-data}}
  template:
    metadata: {labels: {app: mahjong-player-data}}
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: player-data
          image: ghcr.io/freebooz/guiyang-mahjong-player-data:REPLACE_WITH_GIT_SHA
          ports: [{name: http, containerPort: 8080}]
          envFrom:
            - configMapRef: {name: mahjong-services}
            - secretRef: {name: mahjong-secrets}
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 15
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: mahjong-player-data
  namespace: guiyang-mahjong
spec:
  selector: {app: mahjong-player-data}
  ports: [{name: http, port: 8080, targetPort: http}]
# PlayerData 部署：负责玩家资产、奖励、支付证据与补偿事务，不直接接受普通玩家任意余额修改。
# 数据库身份必须最小权限，写接口仅允许受信服务；资源、探针和滚动策略需保护事务可用性。
# Secret 通过引用注入，副本扩展前验证幂等键和 PostgreSQL 并发约束。
