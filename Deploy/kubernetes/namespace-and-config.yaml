apiVersion: v1
kind: Namespace
metadata:
  name: guiyang-mahjong
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mahjong-services
  namespace: guiyang-mahjong
data:
  Auth__PersistenceMode: Postgres
  Auth__ApplyDatabaseMigrations: "false"
  Lobby__Persistence__Mode: RedisPostgres
  Lobby__Persistence__ApplyDatabaseMigrations: "false"
  Lobby__Persistence__RedisConnectionString: redis.cache.svc:6379,abortConnect=false
  Lobby__Allocator__Enabled: "true"
  Lobby__AllowLegacyClientVersionContext: "false"
  Lobby__Allocator__BaseUrl: http://mahjong-allocator:8080
  Lobby__RegionId: cn-southwest
  Lobby__ClusterId: production
  Lobby__LobbyId: lobby-production-1
  Lobby__NodeId: lobby-node-1
  Lobby__TopologyRegistration__Enabled: "true"
  Lobby__TopologyRegistration__AdminBaseUrl: http://mahjong-admin:8080
  Lobby__TopologyRegistration__PublicBaseUrl: http://mahjong-lobby:8080
  Lobby__TopologyRegistration__SourceId: lobby-production-1
  Lobby__TopologyRegistration__Generation: "1"
  Admin__Lobby__Enabled: "true"
  Admin__Lobby__BaseUrl: http://mahjong-lobby:8080
  Admin__Auth__Enabled: "true"
  Admin__Auth__BaseUrl: http://mahjong-auth:8080
  Admin__Management__Enabled: "false"
  Admin__Management__ExecutionEnabled: "false"
  Admin__Management__PollIntervalMilliseconds: "1000"
  Admin__Management__LeaseSeconds: "30"
  Admin__Management__MaxAttempts: "5"
  Admin__Management__RetryBaseSeconds: "5"
  Admin__Management__CommandTimeoutSeconds: "5"
  Admin__Management__TemporaryFreezeHours: "24"
  Admin__Management__MuteHours: "24"
  Admin__Management__RiskLabelTtlDays: "30"
  Admin__Management__PersistenceMode: Postgres
  Admin__Management__ApplyDatabaseMigrations: "false"
  Admin__EnterpriseIdentity__Enabled: "true"
  Admin__EnterpriseIdentity__Authority: https://identity.example.com/tenant
  Admin__EnterpriseIdentity__Audience: mahjong-admin
  Admin__EnterpriseIdentity__RequireHttpsMetadata: "true"
  Admin__EnterpriseIdentity__RequireMfa: "true"
  Admin__EnterpriseIdentity__MaxTokenAgeMinutes: "10"
  Admin__EnterpriseIdentity__RevocationSlaMinutes: "10"
  Admin__Abac__Enabled: "true"
  Admin__Abac__RegionClaim: mahjong_regions
  Admin__Abac__ShiftClaim: mahjong_shift
  Admin__Abac__CaseClaim: mahjong_cases
  Admin__Abac__BreakGlassUntilClaim: mahjong_break_glass_until
  Admin__Abac__HighValueCompensationThreshold: "100000"
  Admin__Abac__BreakGlassMaximumMinutes: "15"
  Admin__WebSecurity__RequireHttps: "true"
  # BFF 会话使用 Admin 自有 PostgreSQL 表；Cookie 不携带企业令牌，设备/IP 仅保存不可逆摘要。
  Admin__WebSecurity__BrowserSessionEnabled: "true"
  Admin__WebSecurity__SessionCookieName: __Host-mahjong-admin
  Admin__WebSecurity__SessionLifetimeMinutes: "10"
  Admin__WebSecurity__CsrfHeaderName: X-Admin-CSRF
  Admin__WebSecurity__BindDevice: "true"
  Admin__WebSecurity__BindIpNetwork: "true"
  Admin__RealtimeCapacity__DefaultPageSize: "100"
  Admin__RealtimeCapacity__MaximumPageSize: "200"
  Admin__RealtimeCapacity__MaximumRooms: "10000"
  Admin__RealtimeCapacity__MaximumPlayers: "100000"
  Admin__RealtimeCapacity__MaximumInstances: "20000"
  Admin__RealtimeCapacity__EventBacklogLimit: "20000"
  Admin__RealtimeCapacity__SubscriberQueueLimit: "256"
  Admin__RealtimeCapacity__SnapshotIntervalSeconds: "5"
  Admin__RealtimeCapacity__PlayerPagesPerSnapshotCycle: "20"
  Admin__RealtimeCapacity__SseEnabled: "true"
  Admin__RealtimeCapacity__LegacyPollingEnabled: "true"
  Admin__AuditArchive__Enabled: "true"
  Admin__AuditArchive__AppendUrl: https://worm-archive.example.com/v1/admin-audit
  Admin__AuditArchive__PollIntervalMilliseconds: "1000"
  Admin__AuditArchive__MaxAttempts: "20"
  Admin__AuditArchive__AnchorEnabled: "true"
  Admin__AuditArchive__AnchorUrl: https://worm-archive.example.com/v1/admin-audit-anchor
  Admin__AuditArchive__AnchorIntervalSeconds: "300"
  Admin__TopologyDiscovery__Enabled: "true"
  Admin__TopologyDiscovery__LeaseSeconds: "60"
  Admin__TopologyDiscovery__TimeoutSeconds: "5"
  Admin__ChatArchive__Enabled: "false"
  Admin__ChatArchive__BaseUrl: https://chat-archive.example.com
  Admin__ChatArchive__TimeoutSeconds: "5"
  Admin__ChatArchive__MaxEntries: "100"
  Admin__ReplayArchive__Enabled: "false"
  Admin__ReplayArchive__BaseUrl: https://replay-archive.example.com
  Admin__ReplayArchive__AccessTtlSeconds: "300"
  Admin__ReplayArchive__MaxObjectMegabytes: "64"
  Admin__Wallet__Enabled: "true"
  Admin__Wallet__BaseUrl: http://mahjong-player-data:8080
  Admin__Configuration__Enabled: "true"
  Admin__Configuration__BaseUrl: http://mahjong-configuration:8080
  Admin__Configuration__TimeoutSeconds: "5"
  Admin__Wallet__TimeoutSeconds: "5"
  Admin__Allocators__0__Enabled: "true"
  Admin__Allocators__0__ClusterId: production
  Admin__Allocators__0__NodeId: agones
  Admin__Allocators__0__BaseUrl: http://mahjong-allocator:8080
  PlayerData__PersistenceMode: Postgres
  PlayerData__ApplyDatabaseMigrations: "false"
  PlayerData__AuthBaseUrl: http://mahjong-auth:8080
  PlayerData__AdminProjectionBaseUrl: http://mahjong-admin:8080
  PlayerData__ProjectionEnabled: "true"
  PlayerData__ProjectionPollMilliseconds: "1000"
  PlayerData__ProjectionMaxAttempts: "10"
  Lobby__AccessRevocationTtlMinutes: "120"
  Allocator__Backend: Agones
  Allocator__StartupTimeoutSeconds: "30"
  Allocator__AllowLegacyInitialFencingToken: "true"
  Allocator__RegionId: cn-southwest
  Allocator__ClusterId: production
  Allocator__NodeId: agones
  Allocator__AllocatorId: allocator-production-1
  Allocator__TopologyRegistration__Enabled: "true"
  Allocator__TopologyRegistration__AdminBaseUrl: http://mahjong-admin:8080
  Allocator__TopologyRegistration__PublicBaseUrl: http://mahjong-allocator:8080
  Allocator__TopologyRegistration__SourceId: allocator-production-1
  Allocator__TopologyRegistration__Generation: "1"
  Allocator__LobbyInternalUrl: http://mahjong-lobby:8080
  Allocator__Agones__Namespace: guiyang-mahjong
  Allocator__Agones__FleetName: guiyang-mahjong
  Allocator__Agones__ApiServer: https://kubernetes.default.svc
  # Fleet 动态配置只决定新分配的兼容路由；旧房间保持原实例和原 Build/RuleSet。
  Allocator__Agones__DynamicFleetConfiguration__Enabled: "true"
  Allocator__Agones__DynamicFleetConfiguration__BaseUrl: http://mahjong-configuration:8080
  Allocator__Agones__DynamicFleetConfiguration__PollSeconds: "30"
  Allocator__Agones__DynamicFleetConfiguration__LastKnownGoodPath: /var/lib/guiyang-mahjong/state/fleet-routing-lkg.json
  Allocator__StateFilePath: /var/lib/guiyang-mahjong/state/instances.json
  Allocator__MatchResultOutboxDirectory: /var/lib/guiyang-mahjong/game-shared/outbox
  Allocator__RecoveryDirectory: /var/lib/guiyang-mahjong/game-shared/recovery
  Allocator__GameServerExecutablePath: /opt/guiyang-mahjong/server/GuiyangMahjongServer
  Allocator__GameServerWorkingDirectory: /opt/guiyang-mahjong/server
  Lobby__Allocator__GameType: guiyang-zhua-ji
  Lobby__Allocator__Region: cn-southwest
  Lobby__Allocator__RuleSetVersion: guiyang-zhuoji-v1
  Lobby__Allocator__ProtocolVersion: "1"
  Lobby__Allocator__RequestedCapacity: "4"
  Lobby__Settlement__Mode: GameData
  Lobby__Settlement__GameDataBaseUrl: http://mahjong-game-data:8080
  GameData__PersistenceMode: Postgres
  GameData__ApplyDatabaseMigrations: "false"
  GameData__LobbyBaseUrl: http://mahjong-lobby:8080
  GameData__EvidenceStorage__Mode: FileSystem
  GameData__EvidenceStorage__RootDirectory: /var/lib/guiyang-mahjong/recovery
  Allocator__GameDataInternalUrl: http://mahjong-game-data:8080
  # BackgroundWorkers 生产拓扑固定三副本 Stream；运行时不执行 DDL，业务清理由数据所有者 API 执行。
  Workers__ApplyDatabaseMigrations: "false"
  Workers__NatsUrl: nats://mahjong-nats.guiyang-mahjong.svc:4222
  Workers__StreamReplicas: "3"
  Workers__AllowSingleNodeStream: "false"
  Workers__StreamRetentionDays: "14"
  Workers__OutboxBatchSize: "100"
  Workers__OutboxLeaseSeconds: "30"
  Workers__MaximumPublishAttempts: "12"
  Workers__ConsumerLagWarningThreshold: "1000"
  Workers__OutboxSources__0__Name: identity
  Workers__OutboxSources__0__Schema: identity_integration
  Workers__OutboxSources__1__Name: lobby
  Workers__OutboxSources__1__Schema: lobby_integration
  Workers__OutboxSources__2__Name: game-data
  Workers__OutboxSources__2__Schema: game_data_integration
  Workers__OutboxSources__3__Name: configuration
  Workers__OutboxSources__3__Schema: configuration_integration
  # Configuration 静态启动配置不参与动态发布；生产运行身份关闭 DDL。
  ConfigurationService__PersistenceMode: Postgres
  ConfigurationService__ApplyDatabaseMigrations: "false"
  ConfigurationService__RetainedVersions: "10"
  Workers__SessionCleanup__Enabled: "false"
  Workers__RoomCleanup__Enabled: "false"
# Kubernetes 命名空间与非敏感 ConfigMap 基线：统一服务发现、区域、集群和可观测性配置。
# Secret、密码和令牌不得放入 ConfigMap；环境特有值由部署流水线覆盖并记录版本。
# Namespace 删除会影响全部资源，生产操作必须二次确认、审批并具备可恢复备份。
