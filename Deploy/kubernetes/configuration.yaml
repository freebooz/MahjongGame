apiVersion: apps/v1
kind: Deployment
metadata:
  name: mahjong-configuration
  namespace: guiyang-mahjong
  labels: {app: mahjong-configuration, release-track: stable}
spec:
  replicas: 2
  selector: {matchLabels: {app: mahjong-configuration}}
  template:
    metadata:
      labels: {app: mahjong-configuration, release-track: stable}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: configuration
          image: ghcr.io/freebooz/guiyang-mahjong-configuration:REPLACE_WITH_GIT_SHA
          ports: [{name: http, containerPort: 8080}]
          envFrom:
            - configMapRef: {name: mahjong-services}
            - secretRef: {name: mahjong-secrets}
          startupProbe:
            httpGet: {path: /health/startup, port: http}
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 15
            timeoutSeconds: 2
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 32Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: mahjong-configuration
  namespace: guiyang-mahjong
spec:
  selector: {app: mahjong-configuration}
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: mahjong-configuration
  namespace: guiyang-mahjong
spec:
  maxUnavailable: 1
  selector: {matchLabels: {app: mahjong-configuration}}
# 配置服务只有 ClusterIP，不创建公网 Ingress；管理员必须经 Admin BFF 调用受控命令。
