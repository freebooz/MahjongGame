apiVersion: apps/v1
kind: Deployment
metadata: {name: mahjong-community, namespace: guiyang-mahjong}
spec:
  replicas: 2
  selector: {matchLabels: {app: mahjong-community}}
  template:
    metadata: {labels: {app: mahjong-community}}
    spec:
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      terminationGracePeriodSeconds: 30
      containers:
        - name: community
          image: ghcr.io/freebooz/guiyang-mahjong-community:REPLACE_WITH_GIT_SHA
          ports: [{name: http, containerPort: 8080}]
          envFrom:
            - configMapRef: {name: mahjong-services}
            - secretRef: {name: mahjong-secrets}
          startupProbe: {httpGet: {path: /health/startup, port: http}, periodSeconds: 2, failureThreshold: 30}
          readinessProbe: {httpGet: {path: /health/ready, port: http}, periodSeconds: 5, timeoutSeconds: 2}
          livenessProbe: {httpGet: {path: /health/live, port: http}, periodSeconds: 15}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: "0.5", memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata: {name: mahjong-community, namespace: guiyang-mahjong}
spec:
  selector: {app: mahjong-community}
  ports: [{name: http, port: 8080, targetPort: http}]
