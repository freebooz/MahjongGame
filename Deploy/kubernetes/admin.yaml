apiVersion: apps/v1
kind: Deployment
metadata:
  name: mahjong-admin
  namespace: guiyang-mahjong
spec:
  replicas: 2
  selector: {matchLabels: {app: mahjong-admin}}
  template:
    metadata: {labels: {app: mahjong-admin}}
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: admin
          image: ghcr.io/freebooz/guiyang-mahjong-admin:REPLACE_WITH_GIT_SHA
          ports: [{name: http, containerPort: 8080}]
          envFrom:
            - configMapRef: {name: mahjong-services}
            - secretRef: {name: mahjong-secrets}
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 15
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: mahjong-admin
  namespace: guiyang-mahjong
spec:
  selector: {app: mahjong-admin}
  ports: [{name: http, port: 8080, targetPort: http}]
# Admin 监控管理服务部署：包含工作负载、服务、探针、资源限制和生产配置注入。
# 管理入口必须置于受控网络与企业身份之后；高风险操作继续执行 RBAC、双人审批和审计。
# 数据库与服务令牌只从 Secret 引用，禁止在清单、镜像或日志中出现明文。
