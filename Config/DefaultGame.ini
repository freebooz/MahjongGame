[/Script/UnrealEd.ProjectPackagingSettings]
bCompressed=True
bSkipEditorContent=True

[/Script/GuiyangMahjongClient.GuiyangLobbySubsystem]
; 默认保留现有 UE RPC 链路。生产 Auth 和 RemoteLobby 发布门禁完成后再切换默认模式。
BackendMode=LocalLegacy
; 旧 RemoteBaseUrl 仅保留回滚兼容期；新部署统一使用 GuiyangPlatformEndpoints.ApiBaseUrl。
RemoteBaseUrl=
RemoteRequestTimeoutSeconds=10.0
RemoteRoutePollIntervalSeconds=0.25
RemoteRoutePollMaxAttempts=120

[/Script/GuiyangMahjongOnline.GuiyangPlatformEndpoints]
; 玩家 HTTP 统一通过 EdgeGateway；正式环境使用 HTTPS，本机人工联调可使用 loopback HTTP。
ApiBaseUrl=
; 实时控制面可独立部署；为空时运行时安全回退到 ApiBaseUrl。
RealtimeBaseUrl=
; 补丁下载与业务 API 分离；当前阶段只建立统一配置，不改变补丁行为。
PatchBaseUrl=
; 下列低基数字段随每个玩家 HTTP 请求发送，供网关执行发布和协议门禁。
ClientVersion=1.0.0
ProtocolVersion=1
Platform=
Channel=default

[/Script/GuiyangMahjongOnline.GuiyangLoginSubsystem]
AuthMode=LocalDevelopment
; 本地离线开发保留模拟登录；联调/生产使用 RemoteAuth 和统一 ApiBaseUrl。
AuthMode=LocalDevelopment
; 旧 AuthBaseUrl 仅保留回滚兼容期，使用时会输出不含地址的废弃警告。
AuthBaseUrl=

[/Script/Agones.AgonesSubsystem]
; UAgonesSubsystem uses Config=Game. Keep its automatic sidecar traffic off for
; local Allocator servers; the project Agones lifecycle adapter explicitly
; starts health and connection calls when MahjongOrchestrator=Agones.
bDisableAutoConnect=True
bDisableAutoHealthPing=True
HealthRateSeconds=5.0
